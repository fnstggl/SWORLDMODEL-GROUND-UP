# Frozen manual best-action fixture 3 (directive: "Required fixture 3: population infrastructure").
#
#   SYNTHETIC INFRASTRUCTURE TEST — NOT A REALISTIC MARKET FORECAST
#
# 100 scripted customer agents in three manually defined profiles; three
# manually supplied offers. Every customer rule is explicit below and based
# only on stated budget limits and stated preferences. This fixture proves
# aggregate branch comparison, AgentSociety scheduling, bounded concurrency,
# result collection, no duplicated agents, and no lost results. It must never
# be cited as evidence of societal realism. Immutable once committed.

fixture_id: population_offer

label: "SYNTHETIC INFRASTRUCTURE TEST — NOT A REALISTIC MARKET FORECAST"

world:
  start_time: "2026-08-05T10:00:00Z"
  cutoff: "2026-08-06T10:00:00Z"

  seller:
    id: seller
    name: Vendor
    private_context: >
      The vendor chooses one of three offers to present to the whole customer
      population.

  # Population is generated by code from these explicit profile blocks:
  # agent ids customer_000 .. customer_099 assigned in order, profile by count.
  customer_profiles:
    - profile_id: budget_conscious
      count: 40
      stated_budget_limit: 20
      stated_preferences: [discount_required]
      # Explicit purchase rule (pure mechanical comparison on offer fields):
      purchase_rule: "buy iff offer.price <= 20 and offer.discount_present == true"
    - profile_id: premium_seeker
      count: 25
      stated_budget_limit: 200
      stated_preferences: [premium_quality_required]
      purchase_rule: "buy iff offer.quality_tier == 'premium' and offer.price <= 200"
    - profile_id: feature_driven
      count: 35
      stated_budget_limit: 80
      stated_preferences: [collaboration_feature_required]
      purchase_rule: "buy iff 'collaboration' in offer.features and offer.price <= 80"

  shared_context: >
    One hundred customers each independently evaluate the vendor's single
    presented offer against their own stated budget limit and stated
    preferences, then either purchase once or decline. No customer interacts
    with another customer.

  starting_events: []

# The three manually supplied offers (one per counterfactual branch).
candidates:
  - id: offer_budget
    actor_id: seller
    time: "2026-08-05T10:05:00Z"
    action: "Present offer: price 18, discount_present true, quality_tier standard, features [basic]."
    offer: {price: 18, discount_present: true, quality_tier: standard, features: [basic]}

  - id: offer_premium
    actor_id: seller
    time: "2026-08-05T10:05:00Z"
    action: "Present offer: price 150, discount_present false, quality_tier premium, features [basic, priority_support]."
    offer: {price: 150, discount_present: false, quality_tier: premium, features: [basic, priority_support]}

  - id: offer_feature
    actor_id: seller
    time: "2026-08-05T10:05:00Z"
    action: "Present offer: price 75, discount_present false, quality_tier standard, features [basic, collaboration]."
    offer: {price: 75, discount_present: false, quality_tier: standard, features: [basic, collaboration]}

evaluator:
  primary_metric: total_revenue
  secondary_metrics:
    - purchases
    - non_purchases
    - failures
    - completed_agent_runs

# Expected deterministic aggregates, derived purely from the explicit rules:
#   offer_budget:  buyers = budget_conscious(40)   -> revenue 40*18  = 720
#   offer_premium: buyers = premium_seeker(25)     -> revenue 25*150 = 3750
#   offer_feature: buyers = feature_driven(35)     -> revenue 35*75  = 2625
# Note the declared primary metric decides the ranking: offer_premium wins on
# total_revenue even though offer_budget has the most purchases -- a built-in
# discriminator that ranking follows declared metrics, not counts or vibes.
expected_deterministic:
  ranking_first: offer_premium
  ranking_by_total_revenue: [offer_premium, offer_feature, offer_budget]
  per_candidate:
    offer_budget:  {purchases: 40, non_purchases: 60, total_revenue: 720,  failures: 0, completed_agent_runs: 100}
    offer_premium: {purchases: 25, non_purchases: 75, total_revenue: 3750, failures: 0, completed_agent_runs: 100}
    offer_feature: {purchases: 35, non_purchases: 65, total_revenue: 2625, failures: 0, completed_agent_runs: 100}

infrastructure_assertions:
  - Exactly 100 customer agents run per branch; expected id set equals the
    collected id set with no duplicates and no losses.
  - Aggregate outcomes equal the sum of per-agent recorded actions.
  - One injected failing agent (failure-injection variant only) is isolated:
    its branch reports failures=1 and completed_agent_runs=99 while every
    other agent completes; other branches are unaffected.
  - Bounded concurrency is respected and observable from run records.
  - Results are collected from per-agent records, never inferred from run
    completion.
